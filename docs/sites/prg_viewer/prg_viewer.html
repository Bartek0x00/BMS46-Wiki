<!DOCTYPE html>
<html lang="en">
<head>
	<title>PRG viewer</title>
	<meta charset="utf-8">
	<style>
		body {
			color: white;
			font-family: monospace;
			font-size: 20px;
			background-color: #121412;
		}
		
		table {
			border-collapse: collapse;
			margin-top: 30px;
			margin-bottom: 30px;
			min-width: 500px;
			background-color: #2d2d2d;
		}		
		
		th {
			border: 2px solid white;
			padding: 8px;
		}
		
		td {
			border: 2px solid white;
			padding: 8px;
		}	
		
		.collapsed td {
			display: none;
		}

		.collapsed {
			height: 1.5em;
			overflow: hidden;
		}

		caption {
			font-size: 24px;
			margin-bottom: 5px;
		}

		.hideBtn {
			cursor: pointer;
			user-select: none;
			position: absolute;
			left: 7px;
			background-color: #2d2d2d;
		}

		.hideBtn:hover {

			static read_operand(mode, data, idx, is_lhs) {
				switch (mode) {
				case "RegS":
				case "RegAB":
				case "RegI":
				case "RegL":
					return BEST_Disassembly.RegisterName.get(data[idx + 2]);
					break;
				case "Imm8":
					return "0x" + data[idx + 2].toString(16);
					break;
				case "Imm16":
					return "0x" + data[idx + 2].toString(16) + data[idx + 3].toString(16);
					break;
				case "Imm32":
					return "0x" + data[idx + 2].toString(16) + data[idx + 3].toString(16) + data[idx + 4].toString(16) + data[idx + 5].toString(16);
					break;
				case "ImmStr":
					const immStrLen = data[idx + 2] | data[idx + 3];
					return data.slice(idx + 4, idx + 4 + immStrLen);
					break;
				default:
					return "";
					break;
				}
			}

			static disasm(rawbytes) {
				const result = [];
				for (let i = 0; i < rawbytes.length - 1; i++) {
					const instr = BEST_Disassembly.OpCodeNames.get(rawbytes[i]);
					const opmode0 = BEST_Disassembly.OperandMode.get((rawbytes[i + 1] & 0xF0) >> 4);
					const opmode1 = BEST_Disassembly.OperandMode.get((rawbytes[i + 1] & 0x0F));
					
					const lhs = BEST_Disassembly.read_operand(opmode0, rawbytes, i + 1, true);
					const rhs = BEST_Disassembly.read_operand(opmode1, rawbytes, i + 1, false);

					switch (instr) {
					default:
						result.push({
							opcode: instr, 
							operand: "0x" + rawbytes[i + 1].toString(16).padStart(2, "0")
						});
						break;
					}
				}
				return result;
			}
		}

		class BEST_Object {
			constructor(arrayBuffer) {
				this.buffer = arrayBuffer;
				this.view = new DataView(this.buffer);
				this.file_off = 0;
				this.jobs = {};
				this.tables = {};

				// Get the first table's address
				const tableAddr = this.readUint32(0x84);
				
				// Get the first table's bytes
				const tableContent = this.readUint64(tableAddr);
				if (!tableContent) {
					console.log("BEST_Object(): Invalid PRG file");
					throw Error("BEST_Object(): Invalid PRG file");
				}

				this.readInfo();
				this.readJobs();
				this.readJobDesc();
				this.readTables();
			}
			
			readInfo() {
				const infoOff = this.readUint32(0x94);
				const v = this.readAndDecrypt(3, infoOff);
				this.version = Array.from(v).map(n => n.toString()).join('.');

				const r = this.readAndDecrypt(4, infoOff + 3);
				this.revision = Array.from(r).map(n => n.toString()).join('.');

				const lc = this.readAndDecrypt(36, infoOff + 72);
				this.lastChange = new TextDecoder("ascii").decode(lc).replace(/\0/g, "");
			}

			readJobs() {
				const jobOff = this.readUint32(0x88);
				const jobCount = this.readUint32(jobOff);
				
				let infoBuff;
				for (let i = 0; i < jobCount; i++) {
					infoBuff = this.readAndDecrypt(68, (jobOff + 4) + (i * 68));
					const job = new BEST_Job();
					job.name = String.fromCharCode(...infoBuff).split('\0')[0].toUpperCase();
					
					const codeOff = new DataView(infoBuff.buffer, infoBuff.byteOffset, infoBuff.byteLength).getUint32(64, true);

					let jobLen = 0;
					
					//console.log(`Start: ${"0x" + codeOff.toString(16)}`);
					for (; ; jobLen += 1) {
						let eoj = this.readAndDecrypt(4, codeOff + jobLen);

						const bytecode = new DataView(eoj.buffer, eoj.byteOffset, 4).getUint32(0, true);
						if (bytecode == 0x1d001d) {
							break;
						}
					}
					//console.log(`End: ${"0x" + (jobLen + codeOff).toString(16)}`);
					
					job.code = this.readAndDecrypt(jobLen, codeOff);
					job.disasm = BEST_Disassembly.disasm(job.code);
					this.jobs[job.name] = job;
				}
			}
			
			readJobDesc() {
				const infoOff = this.readUint32(0x90);
				const descSize = this.readUint32(infoOff);
				let infoBuff = this.readAndDecrypt(descSize, infoOff + 4);
				
				let recordOffset = 0;
				let lastOffset = 0;
				let currentResult = {};
				let jobName = "";

				while (recordOffset < descSize) {
					let currentByte = infoBuff[recordOffset++];
					if (currentByte != 10)
						continue;

					const datasetSlice = infoBuff.slice(lastOffset, recordOffset);
					let [key, value] = new TextDecoder("ascii")
						.decode(datasetSlice)
						.replace(/\n/g, "")
						.trim()
						.split(":", 2);

					key = key.toUpperCase();
					
					const isNotEmpty = (obj) => {
						return !(obj && Object.keys(obj).length === 0);
					}

					switch(key) {
					case "JOBNAME":
						if (isNotEmpty(currentResult))
							this.jobs[jobName].result = currentResult;

						currentResult = new BEST_ResultDesc();
						jobName = value.toUpperCase();
						break;
					case "JOBCOMMENT":
						if (jobName != "")
							this.jobs[jobName].comment = value;
						break;
					case "RESULT":
						if (isNotEmpty(currentResult))
							currentResult.name = value.toUpperCase();
						break;
					case "RESULTTYPE":
						if (isNotEmpty(currentResult))
							currentResult.type = value;
						break;
					case "RESULTCOMMENT":
						if (isNotEmpty(currentResult))
							currentResult.comment = value;
						break;
					}
					
					lastOffset = recordOffset;
				}
			}

			readTables() {
				const tableOff = this.readUint32(0x84);
				const rawCount = this.readAndDecrypt(4, tableOff);
				let tableCount = new DataView(rawCount.buffer, rawCount.byteOffset, 4).getUint32(0, true);
				let cellOff = tableOff + 4;

				for (let i = 0; i < tableCount; i++) {
					let tableBuffer = this.readAndDecrypt(80, (tableOff + 4) + (i * 80));
					let table = new BEST_Table();
					table.name = String.fromCharCode(...tableBuffer.slice(0, 64)).split("\0")[0].toUpperCase();
					
					const tableBufferView = new DataView(tableBuffer.buffer, tableBuffer.byteOffset, tableBuffer.byteLength);
					let tableColOff = tableBufferView.getUint32(0x40, true);
					let tableColCount = tableBufferView.getUint32(0x48, true);
					let tableRowCount = tableBufferView.getUint32(0x4C, true);
					
					let startingCol = tableColOff;
					for (let c = 0; c < tableColCount; c++) {
						let k = 0;
						let tableItemBuffer = [];
						
						do {
							tableItemBuffer[k] = this.readAndDecrypt(1, startingCol + k++);
						} while (tableItemBuffer[k - 1] != 0);

						let header = String.fromCharCode(...tableItemBuffer.slice(0, k - 1)).toUpperCase();
						table.head.push(header);
						startingCol += k;
					}
					
					for (let row = 0; row < tableRowCount; row++) {
						table.data.push([])
						let tableItemBuffer = [];
						
						for (let col = 0; col < tableColCount; col++) {
							let k = 0;
							do {
								tableItemBuffer[k] = this.readAndDecrypt(1, startingCol + k++);
							} while (tableItemBuffer[k - 1] != 0);

							if (k - 1 < 0)
								table.data[row].push("");
							else
								table.data[row].push(String.fromCharCode(...tableItemBuffer.slice(0, k - 1)));
							startingCol += k;
						}
					}
					
					this.tables[table.name] = table;
				}
			}
			
			readAndDecrypt(count, off) {
				const arr = new Uint8Array(this.buffer.slice(off, off + count));
				for (let i = 0; i < arr.length; i++)
					arr[i] ^= 0xF7;
				return arr;
			}
			
			readUint32(off) {
				return this.view.getUint32(off, true);
			}

			readUint64(off) {
				const low = this.view.getUint32(off, true);
				const high = this.view.getUint32(off + 4, true);

				return (BigInt(high) << 32n) | BigInt(low);
			}
		}
		
		function toggleHideTable(id) {
			const table = document.getElementById(id);
			table.classList.toggle("collapsed");

			const btn = table.querySelector(".hideBtn");
			if (table.classList.contains("collapsed")) {
				btn.style.color = "green";
				btn.textContent = "[+]";
			} else {
				btn.style.color = "red";
				btn.textContent = "[-]";
			}
		}
		
		document.addEventListener("DOMContentLoaded", () => {
			document.getElementById("fileInput").addEventListener("change", async (event) => {
				document.querySelectorAll("table").forEach(table => table.remove());
				const file = event.target.files[0];
				if (!file)
					return;

				const buffer = await file.arrayBuffer();

				const obj = new BEST_Object(buffer);
				
				const infoTableData = [
					["Version", obj.version],
					["Revision", obj.revision],
					["Last Change", obj.lastChange],
					["Available Tables", Object.keys(obj.tables).length],
					["Available Jobs", Object.keys(obj.jobs).length]
				];
				const infoTable = document.createElement("table");
				infoTable.id = "infoTable";

				for (const [label, value] of infoTableData) {
					let tr = document.createElement("tr");
				
					let th = document.createElement("th");
					th.textContent = label;
					th.style.textAlign = "left";
					tr.appendChild(th);
				
					let td = document.createElement("td");
					td.textContent = value;
					tr.appendChild(td);

					infoTable.appendChild(tr);
				}

				const caption = document.createElement("caption");
				caption.textContent = "PRG Metadata";
				
				const hideBtn = document.createElement("span");
				hideBtn.classList.add("hideBtn");
				hideBtn.onclick = () => toggleHideTable(`infoTable`);
				hideBtn.textContent = "[-]";
				hideBtn.style.color = "red";

				caption.appendChild(hideBtn);
				infoTable.appendChild(caption);

				document.body.appendChild(infoTable);

				for (const [key, table] of Object.entries(obj.tables)) {
					const defTable = document.createElement("table");
					defTable.id = `table-${key}`;

					let tr = document.createElement("tr");
					
					for (const heading of table.head) {
						let th = document.createElement("th");
						th.textContent = heading;
						tr.appendChild(th);
					}
					defTable.appendChild(tr);
					
					for (const row of table.data) {
						let cell_tr = document.createElement("tr");
						
						for (const cell of row) {
							let cell_td = document.createElement("td");
							cell_td.textContent = cell;
							cell_tr.appendChild(cell_td);
						}
						defTable.appendChild(cell_tr);
					}
					
					const caption = document.createElement("caption");
					caption.textContent = `Table ${table.name}`;

					const hideBtn = document.createElement("span");
					hideBtn.classList.add("hideBtn");
					hideBtn.onclick = () => toggleHideTable(`table-${key}`);
					hideBtn.textContent = "[-]";
					hideBtn.style.color = "red";
					caption.appendChild(hideBtn);

					defTable.appendChild(caption);
					document.body.appendChild(defTable);
				}
				
				for (const [key, job] of Object.entries(obj.jobs)) {
					const jobTable = document.createElement("table");
					jobTable.id = `job-${key}`;

					let tr = document.createElement("tr");

					let th = document.createElement("th");
					th.textContent = "Name";
					th.style.textAlign = "left";
					tr.appendChild(th);

					let td = document.createElement("td");
					td.textContent = job.name;
					tr.appendChild(td);
					
					jobTable.appendChild(tr);
					tr = document.createElement("tr");

					th = document.createElement("th");
					th.style.textAlign = "left";
					th.textContent = "Comment";
					tr.appendChild(th);

					td = document.createElement("td");
					td.textContent = job.comment;
					tr.appendChild(td);

					jobTable.appendChild(tr);

					tr = document.createElement("tr");

					th = document.createElement("th");
					th.style.textAlign = "left";
					th.textContent = "Disasm";
					tr.appendChild(th);

					td = document.createElement("td");
					
					for (let i = 0; i < job.disasm.length; i++) {
						const disasmLine = job.disasm[i];
						td.textContent += `${disasmLine.opcode} ${disasmLine.operand}\n`;
						td.style.whiteSpace = "pre-line";
					}
					tr.appendChild(td);
					
					jobTable.appendChild(tr);

						tr = document.createElement("tr");
						
						th = document.createElement("th");
						th.style.textAlign = "left";
						th.textContent = `ResultName_${resultCount}`;
						tr.appendChild(th);

						td = document.createElement("td");
						td.textContent = result.name;
						tr.appendChild(td);

						jobTable.appendChild(tr);

						tr = document.createElement("tr");

						th = document.createElement("th");
						th.style.textAlign = "left";
						th.textContent = `ResultType_${resultCount}`;
						tr.appendChild(th);

						td = document.createElement("td");
						td.textContent = result.type;
						tr.appendChild(td);

						jobTable.appendChild(tr);

						tr = document.createElement("tr");

						th = document.createElement("th");
						th.style.textAlign = "left";
						th.textContent = `ResultComment_${resultCount}`;
						tr.appendChild(th);

						td = document.createElement("td");
						td.textContent = result.comment;
						tr.appendChild(td);

						jobTable.appendChild(tr);

					const caption = document.createElement("caption");
					caption.textContent = `Job ${job.name}`;

					const hideBtn = document.createElement("span");
					hideBtn.classList.add("hideBtn");
					hideBtn.onclick = () => toggleHideTable(`job-${key}`);
					hideBtn.textContent = "[-]";
					hideBtn.style.color = "red";
					caption.appendChild(hideBtn);

					jobTable.appendChild(caption);
					document.body.appendChild(jobTable);
				}
			});
		});
	</script>
</head>
<body>
	<input type="file" id="fileInput">
</body>
