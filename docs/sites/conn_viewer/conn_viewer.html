		<title>Connector Viewer</title>

			* {
				font-family: monospace;
				color: white;
			}

			}
			
			h2 {
				font-size: 30px;
				margin-bottom: 4px;
			}

			body {
				background-color: #222422;
			}
			
			table {
				border-collapse: collapse;

				border: collapse;
				border: 2px solid white;

				width: max-content;
			}

			#svg-overlay-m5 {

				height: 85%;

				display: grid;

				grid-template-columns: repeat(3, 1fr);
				grid-template-rows: repeat(3, 1fr);
			}

			.cell-m1, .cell-m2, .cell-m3, .cell-m4, .cell-m5 {

				cursor: pointer;
				background-color: grey;
			}

			.cell-m1 {

			}

			.cell-m2 {
				height: 35%;
			}

			.cell-m3 {

			}

			.cell-m4 {
				height: 35%;
			}

			.cell-m5 {

			}

			@keyframes row-flash {
				from {
					background-color: rgba(255, 230, 100, 0.9);
				}

				to {
					background-color: transparent;
				}
			}

			.highlight {
				animation: row-flash 2s ease-out;
			}

			#go-top-btn {
				position: fixed;
				top: 10px;
				left: calc(50% - 65px);
				padding: 10px 40px;
				font-size: 16px;
				cursor: pointer;
				z-index: 1000;
				color: white;
				background-color: grey;
				border: 2px solid white;
				opacity: 0;
				pointer-events: none;
				transition: opacity 0.6s;
			}

			#go-top-btn.visible {
				opacity: 1;
				pointer-events: auto;
			}

			#svg-titles {
				width: 100%;
				max-width: 1200px;

				margin-top: 8px;
				
				display: grid;
				grid-template-columns: repeat(5, 1fr);
				grid-template-rows: repeat(1, 1fr);
			}

			#svg-title-m1, #svg-title-m2, #svg-title-m3, #svg-title-m4, #svg-title-m5 {

				text-align: center;

			}

			#svg-title-m3 {

			}

			#svg-title-m4 {

			}

			#svg-title-m5 {

			}

			#svg-legend {
				padding-top: 20px;
				display: grid;
				grid-template-columns: repeat(2, 1fr);
				grid-template-rows: repeat(3, 1fr);
				font-size: 150%;
			}

			#svg-legend div {

			}

			#svg-legend-mass {

			}

			#svg-legend-power {

			#svg-legend-analog {

			#svg-legend-digital-pwm {

			}

			#svg-legend-digital-bit {

			}
		</style>

	<script type="module">
		let assignConnector = null;
		let assignConnectorPath = "../../assets/connector/connector_map.json";

		const resp = await fetch(assignConnectorPath);
		if (!resp.ok)
			throw new Error(`Cannot find connector mapping at ${assignConnectorPath}`);

		assignConnector = await resp.json();

		const pretty_column_names = [
			"Pin",
			"Short_Name",
			"Full_Name",
			"Type",
			"Direction",
			"Software",
			"Comment"
		];

		const json_column_names = [
			"name",
			"fullname",
			"type",
			"direction",
			"software",
			"comment"
		];

		const pin_list_container = document.getElementById("pin-list-container");

		const add_row = (table, data, is_header = false) => {
			const tr_el = document.createElement("tr");
			
			if (!is_header)
				tr_el.id = `pin-row_${data[0]}`;

			for (const cell of data) {
				const td_el = document.createElement("td");
				td_el.textContent = cell;

				tr_el.append(td_el);
			}

			table.append(tr_el);
		}

		const add_table = (module) => {
			const header_el = document.createElement("h2");
			header_el.textContent = `Module ${module}`;

			const table_el = document.createElement("table");
			table_el.id = `pin-list_m${module}`;
			table_el.userData_module = module;
			
			add_row(table_el, pretty_column_names, true);
			
			for (const [key, value] of Object.entries(assignConnector[module])) {
				const data = [`${module}-${key.padStart(2, '0')}`];

				for (const name of json_column_names)
					data.push(value[name]);
				
				add_row(table_el, data);
			}	

			pin_list_container.append(header_el);
			pin_list_container.append(table_el);
		}

		const assign_pin_btns = () => {
			const pin_btns = document.querySelectorAll(".cell-m1, .cell-m2, .cell-m3, .cell-m4, .cell-m5");
			for (const pin_btn of pin_btns) {
				const module_pin = pin_btn.id.slice(-4);
				const module = module_pin[0];
				const pin = module_pin.slice(-2).replace(/^0+/, "");

				const data = assignConnector[module][pin];
				if (data && data["type"]) {
					let color = "grey";

					switch (data["type"]) {
						case "mass":
							color = "#852A2A";
							break;
						case "power":
							color = "red";
							break;
						case "analog":
							color = "orange";
							break;
						case "digital_data":
							color = "magenta";
							break;
						case "digital_pwm":
							color = "green";
							break;
						case "digital_bit":
							color = "lightseagreen";
					}

					pin_btn.style.backgroundColor = color;
				}

				let tooltip = `${module_pin}`;
				if (data && data["name"])
					tooltip += `   (${data["name"]})`;
				pin_btn.title = tooltip;

				const target = document.getElementById(`pin-row_${module_pin}`);

				if (!target)
					continue;

				pin_btn.addEventListener("click", () => {
					
					
					target.scrollIntoView({
						behavior: "smooth",
						block: "center"
					});
						
					target.classList.remove("highlight");
					void target.offsetWidth;

					target.classList.add("highlight");

					setTimeout(() => {
						target.classList.remove("highlight");
					}, 2000);
				});
			}
		};

		add_table(1);
		add_table(2);
		add_table(3);
		add_table(4);
		add_table(5);

		assign_pin_btns();
	</script>
